      ["Hue +","&rgb_ug RGB_HUI",1.5], ["Hue -","&rgb_ug RGB_HUD",1.5],
      ["Sat +","&rgb_ug RGB_SAI",1.5], ["Sat -","&rgb_ug RGB_SAD",1.5],
      ["RGB +","&rgb_ug RGB_BRI",1.5], ["RGB -","&rgb_ug RGB_BRD",1.5],
      ["Speed +","&rgb_ug RGB_SPI",1.75], ["Speed -","&rgb_ug RGB_SPD",1.75],
      ["Effect","&rgb_ug RGB_EFF",1.75], ["Effect back","&rgb_ug RGB_EFR",2.25]],
     [["BL on","&bl BL_ON",1.5], ["BL off","&bl BL_OFF",1.5],
      ["BL toggle","&bl BL_TOG",1.75], ["BL +","&bl BL_INC",1.25],
      ["BL -","&bl BL_DEC",1.25], ["BL cycle","&bl BL_CYCLE",1.75]]]},

  {name: "Power and firmware",
   note: `<b>Reset</b> and <b>Bootloader</b> are on every board (bootloader is how you
          flash without touching the button). <b>Ext pwr</b> switches the board's own
          3.3V rail - the LEDs and the display hang off it. <b>Soft off</b> needs a
          wake-up source wired up, and <b>Studio unlock</b> only means something on a
          ZMK Studio build.`,
   rows: [
     [["Ext pwr on","&ext_power EP_ON",2], ["Ext pwr off","&ext_power EP_OFF",2],
      ["Ext pwr tog","&ext_power EP_TOG",2], _sp(.5),
      ["Soft off","&soft_off",1.75], ["Reset","&sys_reset",1.5],
      ["Bootloader","&bootloader",2], ["Studio unlock","&studio_unlock",2.5]]]},

  {name: "Typing extras",
   note: `Plain ZMK behaviors, no hardware behind them: <b>Caps word</b> shifts until
          the next space, <b>Key repeat</b> sends whatever the last key sent,
          <b>Grave/Esc</b> is escape alone and <code>~</code> with GUI or shift held.`,
   rows: [
     [["Caps word","&caps_word",2], ["Key repeat","&key_repeat",2],
      ["Grave/Esc","&gresc",2]]]},

  {name: "Sticky and locked keys",
   note: `Two ways to hold a modifier without holding it. <code>&amp;sk</code> is a
          one-shot: tap it and the <b>next</b> key comes with that modifier applied,
          nothing to chord. <code>&amp;kt</code> is a latch: it presses the key and
          leaves it pressed until the same key is pressed again. Both take any keycode
          - these eight are the ones worth a button; anything else is
          <code>&amp;sk</code>/<code>&amp;kt</code> plus a keycode, typed into the
          field. A sticky <b>layer</b> is on the <b>Layers</b> tab, with the rest of
          the layer switching.`,
   rows: [
     [["Sticky LShift","&sk LSHFT",2], ["Sticky RShift","&sk RSHFT",2],
      ["Sticky LCtrl","&sk LCTRL",2], ["Sticky RCtrl","&sk RCTRL",2],
      ["Sticky LAlt","&sk LALT",2], ["Sticky RAlt","&sk RALT",2],
      ["Sticky LGui","&sk LGUI",2], ["Sticky RGui","&sk RGUI",2]],
     [["Lock LShift","&kt LSHFT",2], ["Lock RShift","&kt RSHFT",2],
      ["Lock LCtrl","&kt LCTRL",2], ["Lock RCtrl","&kt RCTRL",2],
      ["Lock LAlt","&kt LALT",2], ["Lock RAlt","&kt RALT",2],
      ["Lock LGui","&kt LGUI",2], ["Lock RGui","&kt RGUI",2]]]}
];

// Tile legends for the half of SYSTEM that is not a `&kp`: `label()` reads
// BIND_LABELS for those and KEY_LABELS for the consumer codes, so a board tile
// says "BT 0" and "Left click" instead of the raw binding. Same derive-don't-
// retype rule as `_learnLabels()`.
function _learnSystem(rows){
  for (const ent of rows){
    const [lbl, code] = ent;
    if (!code) continue;
    if (code.startsWith("&")){
      if (!(normBind(code) in BIND_LABELS)) BIND_LABELS[normBind(code)] = lbl;
    } else if (!(code in KEY_LABELS)) KEY_LABELS[code] = lbl;
  }
}
SYSTEM.forEach(g => g.rows.forEach(_learnSystem));
// LCLK/RCLK/MCLK are MB1/MB2/MB3 under another name (pointing.h names both), and
// a hand-written keymap may spell either - the tile answers to both.
[["MB1","LCLK"], ["MB2","RCLK"], ["MB3","MCLK"]].forEach(([a, b]) =>
    BIND_LABELS[`&mkp ${a}`] = BIND_LABELS[`&mkp ${b}`]);

PICKER.forEach(_learnLabels); _learnLabels(PICKER_EXTRA);

const bindOf = code => code.startsWith("&") ? code : "&kp " + code;
// https://zmk.dev/docs/keymaps/modifiers - kept in sync with custom.py's MODS.
const MODS = ["LS","RS","LC","RC","LA","RA","LG","RG"];
const MOD_LABELS = {LS:"LShift", RS:"RShift", LC:"LCtrl", RC:"RCtrl",
                    LA:"LAlt", RA:"RAlt", LG:"LGui", RG:"RGui"};
const codeOf = b => (b||"").replace(/^&kp\s+/, "");
// `mods` nests outermost-first, e.g. ["LS","LA","LC"] -> LS(LA(LC(<code>))). Building
// the wrap happens innermost-out (reduceRight), the on-screen chain reads outermost-in
// left to right (modChainText) - same order humans click and read parens in.
const modChain = rec => (rec.mods||[]).reduceRight((acc,m) => `${m}(${acc})`, codeOf(rec.param));
const modBinding = rec => `&kp ${modChain(rec)}`;
const modChainText = mods => mods.map(m => m+"(").join("") + ")".repeat(mods.length);
const CHAIN_RE = /^(LS|RS|LC|RC|LA|RA|LG|RG)\(/;
function parseModChain(text){
  let s = (text||"").trim(), mods = [];
  while (mods.length < 3){
    const m = CHAIN_RE.exec(s);
    if (!m) break;
    mods.push(m[1]); s = s.slice(m[0].length);
  }
  return mods;
}

// Layer entries. `layerBinding()` mirrors custom._emit_layer() far enough to label
// and match a card - the server is still what emits, and the two are kept in sync by
// hand, exactly like MODS. There is no `mo` mode to save: `&mo <n>` is built into ZMK,
// takes one parameter, and the picker's Layers tab builds one in a single click with
// no record at all (see "Saving is optional" in views/layer.md) - so the only two
// kinds worth naming are a layer-tap (declares nothing unless it needs a custom
// tapping term or flavor, which turns it into a generated `lt_<name>` hold-tap node)
// and a conditional layer.
const paramOf = b => (b||"").trim().split(/\s+/).slice(1).join(" ");
const ltCustom = r => !!(r.tapping_term_ms || r.flavor);
function layerBinding(r){
  const mode = r.mode || "lt";
  if (mode === "conditional") return "";
  const n = +r.layer || 0;
  const code = paramOf(r.key || "");
  if (!code) return "";
  return ltCustom(r) ? `&lt_${r.name} ${n} ${code}` : `&lt ${n} ${code}`;
}
// A custom layer-tap is referenced by its generated label, a built-in one by its whole
// text - the same split as usesVd() vs modBinding(), for the same reason.
const usesLayer = (v, r) => {
  const t = (v||"").trim();
  if (!t) return false;
  return ltCustom(r) ? t.split(/\s+/)[0].replace(/^&/, "") === "lt_" + r.name
                     : t === layerBinding(r);
};
const layerTitle = r => (r.mode || "lt") === "conditional"
  ? `hold layers ${(r.if_layers||[]).join(" + ")} \u2192 layer ${r.then_layer ?? "?"}`
  : `tap: ${r.key || "?"}\nhold: layer ${+r.layer || 0}`
    + (ltCustom(r) ? `\nterm: ${r.tapping_term_ms || 200}ms`
                   + `\nflavor: ${r.flavor || "balanced"}` : "");

function pickerKey(ent, cur, off){
  const [lbl, code, w] = ent;
  const width = `width:${w*36-4}px`;
  if (!code) return `<span class="sp" style="${width}"></span>`;
  const b = bindOf(code);
  const parts = Array.isArray(lbl) ? lbl : lbl.split("|");
  const body = parts.length > 1
    ? `<span class="up">${esc(parts[0])}</span><span>${esc(parts[1])}</span>`
    : `<span>${esc(parts[0])}</span>`;
  return `<button type="button" class="pk${b === cur ? " sel" : ""}`
       + `${off ? " off" : ""}" style="${width}" data-bind="${esc(b)}"`
       + ` title="${esc(b)}">${body}</button>`;
}

function gridHtml(cur){
  return PICKER.map(r =>
      `<div class="prow">${r.map(e => pickerKey(e, cur)).join("")}</div>`).join("")
    + `<div class="prow extra">`
    + PICKER_EXTRA.map(e => pickerKey(e, cur)).join("") + `</div>`;
}

// The Media & system tab. One group per SYSTEM entry: a heading, the note that
// says what a board needs for the group to work, then its rows - the same
// `.pk[data-bind]` buttons the Keyboard tab draws, so `pickBinding()` assigns
// them with no extra wiring.
//
// One context dims rather than hides: a layer-tap's tap key is a *keycode*,
// since `&lt <n> <code>` wraps whatever the field holds - `&mkp LCLK` there
// would emit `&lt 2 LCLK` and build into nonsense. The media half of this tab is
// perfectly valid in that slot, so the tab stays (unlike VileDance and Layers,
// which `menuTarget()` excludes outright) and only the behaviors go dim.
function systemHtml(cur){
  const kpOnly = state.editing === null && state.emode === "layer";
  return (kpOnly ? `<div class="pnote">A layer-tap's tap key has to be a plain`
                 + ` keycode, so everything that is a behavior of its own is`
                 + ` dimmed here.</div>` : "")
    + SYSTEM.map(g =>
        `<div class="pgroup"><h4>${esc(g.name)}</h4>`
      + `<div class="pnote">${g.note}</div>`
      + g.rows.map(r => `<div class="prow">` + r.map(e =>
            pickerKey(e, cur, kpOnly && !!e[1] && e[1].startsWith("&"))).join("")
          + `</div>`).join("")
      + `</div>`).join("")
    + `<div class="hint">Every button here is a whole binding: with a key open it`
    + ` assigns straight away, exactly like the Keyboard tab. Nothing needs to be`
    + ` added to the keymap's <code>#include</code> lines by hand - saving a variant`
    + ` adds the <code>dt-bindings</code> headers the bindings you used need.</div>`;
}

// A saved-things tab: click the card to fill the field, click its \u270e to open
// the record in the editor area above. `+ New \u2026` opens a blank one there.
const cardEdit = (mode, name) =>
  `<button type="button" class="pkedit" data-edit="${mode}" data-name="${esc(name)}"`
  + ` title="edit ${esc(name)}">\u270e</button>`;

function viledanceHtml(cur){
  const items = STORE.viledance || [];
  if (!items.length)
    return `<div class="hint">No VileDances saved yet.</div>`
         + newRow("viledance", "viledance");
  return `<div class="tdlist">` + items.map(t =>
      `<span class="pkg"><button type="button" class="pk td${usesVd(cur, t.name)?" sel":""}"`
      + ` data-vd="${esc(t.name)}" title="${esc(vdTitle(t))}">`
      + `<span>&amp;${esc(t.name)}</span><span class="up">`
      + esc([t.tap, t.hold, t.double_tap, t.tap_hold].filter(Boolean).join("  /  "))
      + `</span></button>` + cardEdit("viledance", t.name) + `</span>`).join("")
    + `</div>` + newRow("viledance", "viledance");
}

// A saved VileDance is emitted under a generated label (`&ht_<name>`, `&vd_<name>`),
// so match on the reference's last name part, not on the raw name.
const usesVd = (v, name) => {
  const t = (v||"").trim().split(/\s+/)[0].replace(/^&/, "");
  return t === name || t.endsWith("_" + name);
};

// title text for a VileDance card: the resolved four slots, so hovering shows
// exactly what tap / hold / double tap / tap+hold will send, not just the name.
const vdTitle = t => SLOTS.map(([k, lbl]) => t[k] ? `${lbl}: ${t[k]}` : null)
  .filter(Boolean).join("\n");

// The Macros tab. A macro's key binding is always `&mc_<name>` - it does not
// depend on which fields are filled, the way a VileDance's does - so a card is an
// ordinary `data-bind` pick with no `/api/preview` round trip behind it.
// `macroBinding()` is the hand-kept mirror of `emit_macro()`'s label, exactly as
// `layerBinding()` is of `_emit_layer()`.
const macroBinding = m => `&mc_${m.name}`;
const stepText = s =>
    s.action === "text" ? `"${s.text || ""}"`
  : s.action === "wait" ? `wait ${s.ms || 0}ms`
  : s.action === "pause" ? "pause until release"
  : `${s.action} ${s.binding || "?"}`;
const macroTitle = m => (m.steps || []).map(stepText).join("\n");
const macroSummary = m => {
  const t = (m.steps || []).map(stepText).join("  \u00b7  ");
  return t.length > 46 ? t.slice(0, 45) + "\u2026" : t;
};

function macroHtml(cur){
  const items = STORE.macro || [];
  if (!items.length)
    return `<div class="hint">No macros saved yet. A macro is a sequence the keyboard`
         + ` plays back from one key: text, taps, a modifier held across them, a wait.`
         + `</div>` + newRow("macro", "macro");
  return `<div class="tdlist">` + items.map(m =>
      `<span class="pkg"><button type="button" class="pk td`
      + `${macroBinding(m) === cur ? " sel" : ""}" data-bind="${esc(macroBinding(m))}"`
      + ` title="${escA(macroTitle(m))}"><span>&amp;mc_${esc(m.name)}</span>`
      + `<span class="up">${esc(macroSummary(m))}</span></button>`
      + cardEdit("macro", m.name) + `</span>`).join("")
    + `</div>` + newRow("macro", "macro");
}

function modifierHtml(cur){
  const items = STORE.modifier || [];
  if (!items.length)
    return `<div class="hint">No modifiers saved yet.</div>`
         + newRow("modifier", "modifier");
  return `<div class="tdlist">` + items.map(m =>
      `<span class="pkg"><button type="button" class="pk td${modBinding(m)===cur?" sel":""}"`
      + ` data-mod="${esc(m.name)}" title="${esc(modBinding(m))}">`
      + `<span>${esc(m.name)}</span><span class="up">${esc(modBinding(m))}</span>`
      + `</button>` + cardEdit("modifier", m.name) + `</span>`).join("")
    + `</div>` + newRow("modifier", "modifier");
}

// A blank layer's bindings: `&trans` at every position this keyboard has. Read
// off an existing layer's length when there is one - the source of truth for
// key count - and fall back to the selected layout only for a keyboard with no
// layers at all.
function blankBindings(km){
  const n = km.layers.length ? km.layers[0].bindings.length
          : (km.layouts[Math.min(state.layout, km.layouts.length-1)] || {}).count || 0;
  return Array.from({length:n}, () => "&trans");
}

// This keyboard's layers, its own plus any added-but-not-yet-saved ones from
// `state.newLayers` - the two are indistinguishable everywhere else in the page
// (the tab bar, the picker's Layers tab, a layer entry's layer-number select),
// since a pending layer edits and previews exactly like a real one; only "Save
// as variant" needs to tell them apart.
function layersOf(km){
  if (!km) return [];
  const pending = state.newLayers[km.id] || [];
  return km.layers.concat(pending.map(p =>
      ({name:p.name, display:p.name, bindings: blankBindings(km),
        reserved:false, pending:true})));
}

// The layers this keyboard has, or 0-9 when no keymap is selected - a layer number
// is a number, and the picker should not refuse to offer one just because nothing
// on the left is highlighted.
function layerRows(){
  const km = byId(state.id);
  const all = layersOf(km);
  return all.length ? all.map((l, i) => [i, l.display])
                    : Array.from({length:10}, (_, i) => [i, ""]);
}

// The keycode a layer-tap would tap, taken from whatever is in the field already:
// `&kp SPACE` -> SPACE, `&lt 3 SPACE` -> SPACE (so clicking another layer moves it),
// anything else -> "". That is what makes "click SPACE on the Keyboard tab, then
// click `lt 2` here" work.
function ltCode(v){
  const t = (v || "").trim().split(/\s+/);
  if (t.length === 2 && /^&kp$/.test(t[0])) return t[1];
  if (t.length === 3 && /^&lt/.test(t[0])) return t[2];
  return "";
}

// Two ways in, and the ad-hoc one comes first: `&mo` and `&lt` are built into ZMK, so
// a layer binding needs nothing saved anywhere. The saved cards below are names for
// the ones worth reusing - a bonus, not the way in. A conditional layer is never
// listed either way: it goes on no key.
function layerHtml(cur){
  const rows = layerRows();
  const code = ltCode(cur);
  const sel = bind => bind && bind === (cur||"").trim() ? " sel" : "";
  // Four of the five rows are whole bindings, so they are ordinary `data-bind`
  // picks - the same button the Keyboard tab emits, wired and highlighted by the
  // same two lines. `&lt` is the one that cannot be: it composes with the keycode
  // the field already holds, so it keeps its own `data-lt` and its own handler.
  const cell = (n, name, bind) =>
    `<button type="button" class="pk${sel(bind)}" style="width:68px"`
    + ` data-bind="${esc(bind)}" title="${esc(bind)}">`
    + `<span class="up">${esc(name || ("layer " + n))}</span><span>${n}</span></button>`;
  const ltCell = (n, name) => {
    const bind = code ? `&lt ${n} ${code}` : "";
    return `<button type="button" class="pk${sel(bind)}" style="width:68px"`
      + ` data-lt="${n}" title="${esc(bind || `&lt ${n} <key>`)}">`
      + `<span class="up">${esc(name || ("layer " + n))}</span><span>${n}</span></button>`;
  };
  const row = (label, cells) =>
    `<div class="prow"><span class="ptarget" style="width:112px">${label}</span>`
    + cells + `</div>`;
  let h = `<div class="hint">Click a layer to fill the field - nothing has to be saved`
        + ` for this. <b>Hold</b> is <code>&amp;mo</code>, on only while it is held.`
        + ` <b>Tap key / hold layer</b> is <code>&amp;lt</code>, wrapping the key the`
        + ` field already holds`
        + (code ? ` - right now <code>${esc(code)}</code>.`
                : `, so pick one on the <b>Keyboard</b> tab first (or type it in).`)
        + ` <b>Sticky</b> is <code>&amp;sl</code>: one shot, for the next key only.`
        + ` <b>Toggle</b> is <code>&amp;tog</code>: on until it is pressed again.`
        + ` <b>Switch to</b> is <code>&amp;to</code>: on, and every other layer off -`
        + ` which is a one-way trip unless the layer you land on can get back.</div>`
    + row("Hold", rows.map(([n, name]) => cell(n, name, `&mo ${n}`)).join(""))
    + row("Tap key / hold layer", rows.map(([n, name]) => ltCell(n, name)).join(""))
    + row("Sticky", rows.map(([n, name]) => cell(n, name, `&sl ${n}`)).join(""))
    + row("Toggle", rows.map(([n, name]) => cell(n, name, `&tog ${n}`)).join(""))
    + row("Switch to", rows.map(([n, name]) => cell(n, name, `&to ${n}`)).join(""));
  const items = (STORE.layer || []).filter(r => (r.mode||"lt") !== "conditional");
  if (items.length)
    h += `<div class="tdlist">` + items.map(r =>
        `<span class="pkg"><button type="button" class="pk td${usesLayer(cur, r)?" sel":""}"`
        + ` data-lay="${esc(r.name)}" title="${esc(layerTitle(r))}">`
        + `<span>${esc(r.name)}</span><span class="up">${esc(layerBinding(r))}</span>`
        + `</button>` + cardEdit("layer", r.name) + `</span>`).join("") + `</div>`;
  return h + newRow("layer", "layer-tap");
}

// ------------------------------------------- the two board-wide tabs
// Neither a combo nor a conditional layer goes on a key, so neither tab fills
// anything: a row is a switch plus a way into its record. `enabled` is exactly
// what `build_variant()` already reads - on means it is written into the next
// variant, off means it is left out.
function brow(mode, r, sub, scope){
  const on = scopeOn(r, scope);
  const open = state.emode === mode && (draftOf(mode).name || "") === r.name;
  const elsewhere = Object.keys(r.scopes || {}).filter(k => r.scopes[k] && k !== scope);
  return `<div class="brow${on ? "" : " off"}${open ? " sel" : ""}">`
    + `<button type="button" class="tgl ${on ? "on" : "off"}" data-tgl="${mode}"`
    + ` data-name="${esc(r.name)}" title="${on ? "written into this keymap's variant"
                                              : "left out of this keymap's variant"}`
    + `${elsewhere.length ? "\n\nalso on for: " + esc(elsewhere.join(", ")) : ""}">`
    + `${on ? "On" : "Off"}</button>`
    + `<button type="button" class="bopen" data-edit="${mode}" data-name="${esc(r.name)}">`
    + `<span class="nm">${esc(r.name)}</span><small>${esc(sub)}</small></button></div>`;
}

const boardList = (mode, items, sub, label) => {
  const scope = scopeOf(byId(state.id));
  return (items.length ? `<div class="blist">`
      + items.map(r => brow(mode, r, sub(r), scope)).join("") + `</div>`
    : `<div class="hint">nothing saved yet</div>`) + newRow(mode, label);
};

// The line both board-wide tabs end their hint with: which keymap these switches
// are answering for. A config or vendor keymap is never written to (only
// `variants/` is ours), so there the switches describe the variant about to be
// saved from it; the flags follow that variant under its own name.
function scopeNote(){
  const km = byId(state.id);
  if (!km) return `<div class="hint">Pick a keyboard on the left first.</div>`;
  return `<div class="hint">These switches are <b>for ${esc(km.name)}</b> only`
       + (km.kind === "variant"
          ? ` \u2013 each saved variant keeps its own set.`
          : ` \u2013 <code>${esc(km.kind)}</code> keymaps are never written to, so`
            + ` what is On here is what goes into the next variant you save from`
            + ` it, and stays On for that variant afterwards.`)
       + `</div>`;
}

function comboHtml(){
  return `<div class="hint">A combo is <b>board-wide</b>: press two or more keys`
       + ` together, anywhere. It sits on no key of its own, so there is nothing to`
       + ` pick here - switch one <b>On</b> and it goes into this keymap's variant,`
       + ` <b>Off</b> and it is left out. Click a row to edit it; the board above is`
       + ` where its chord is chosen.</div>`
    + scopeNote()
    + boardList("combo", STORE.combo || [],
        r => `${(r.key_positions||[]).join(" + ")} \u2192 ${r.binding || "?"}`,
        "combo");
}

function conditionalHtml(){
  const items = (STORE.layer || []).filter(r => (r.mode||"lt") === "conditional");
  return `<div class="hint">A conditional layer is <b>board-wide</b> too: hold`
       + ` <b>all</b> of its if-layers at once and the then-layer comes on top - the`
       + ` tri-layer trick. Nothing references it, so nothing can pull it in for you:`
       + ` <b>On</b> writes it into this keymap's variant, <b>Off</b> leaves it out.</div>`
    + scopeNote()
    + boardList("conditional", items,
        r => `hold ${(r.if_layers||[]).join(" + ")} \u2192 layer ${r.then_layer ?? "?"}`,
        "conditional layer");
}

// The bottom row of every tab that lists saved things. It opens that kind's real
// creation panel in the editor area above - no navigation, nothing lost: the field
// you came from is still up there, and this menu still fills it.
//
// Clicking a key on the board closes whatever panel was open (only one thing fits
// in the editor area), so a half-typed draft would otherwise have no way back:
// `+ New` blanks it. Hence **Resume**, which appears exactly when there is a
// dirty draft for this kind and it is not already on screen.
function newRow(mode, label){
  const d = state.drafts[mode];
  const dirty = d && state.emode !== mode
             && JSON.stringify(d) !== JSON.stringify(BLANK[mode]());
  return `<div class="rowbtns">`
    + (dirty ? `<button type="button" class="ghost sm" data-open="${mode}">`
               + `Resume ${esc(d.name || "unnamed " + label)}…</button>` : "")
    + `<button type="button" class="ghost sm" data-new="${mode}">+ New ${label}…</button>`
    + `</div>`;
}

// One menu, six tabs. The first four fill the binding field open above them; the
// last two are board-wide and fill nothing, so a separator sits between the sets.
const PTABS = [["keyboard","Keyboard"], ["system","Media & system"],
               ["viledance","VileDance"], ["macro","Macros"],
               ["modifier","Modifiers"], ["layer","Layers"],
               ["combo","Combos"], ["conditional","Conditional layers"]];
const BOARD_TABS = ["combo", "conditional"];

// The picker body is re-rendered on its own when you switch tabs, so that
// whatever is half-typed in the field it writes into survives the switch.
// `ptab` defaults to `state.ptab`; a caller with a narrowed tab set passes the
// resolved one instead, since `state.ptab` may be pointing at a tab this call
// excludes (see `menuHtml()`).
function pickerBody(cur, ptab){
  ptab = ptab || state.ptab;
  return ptab === "system" ? systemHtml(cur)
       : ptab === "viledance" ? viledanceHtml(cur)
       : ptab === "macro" ? macroHtml(cur)
       : ptab === "modifier" ? modifierHtml(cur)
       : ptab === "layer" ? layerHtml(cur)
       : ptab === "combo" ? comboHtml()
       : ptab === "conditional" ? conditionalHtml()
       : gridHtml(cur);
}

// What the menu is filling right now, and which tabs this context forbids. Two
// contexts narrow: a VileDance's own slots cannot take another VileDance, and a
// layer-tap's tap key can take neither a layer nor a VileDance (see
// views/viledance.md and views/layer.md). With nothing open in the editor area
// there is no field at all, and the menu still draws: the board-wide tabs never
// had one.
function menuTarget(km, layer){
  if (state.editing !== null){
    const orig = layer ? layer.bindings[state.editing] : "";
    const cur = (state.assign[state.layer] || {})[state.editing] ?? orig ?? "";
    return {cur: String(cur).trim(), exclude: []};
  }
  const d = state.emode ? draftOf(state.emode) : null;
  if (state.emode === "viledance") return {cur:(d.tap||"").trim(),
                                           exclude:["viledance"]};
  if (state.emode === "macro"){
    const st = (d.steps || []).find(x => x.binding);
    return {cur:(st ? st.binding : "").trim(), exclude:["macro"]};
  }
  if (state.emode === "combo")     return {cur:(d.binding||"").trim(), exclude:[]};
  if (state.emode === "modifier")  return {cur:(d.param||"").trim(), exclude:[]};
  if (state.emode === "layer")     return {cur:(d.key||"").trim(),
                                           exclude:["viledance","layer","macro"]};
  return {cur:"", exclude:[]};
}

// The one menu. Always rendered in LIVE mode, below whatever the editor area
// holds; a separator splits the four field-filling tabs from the two board-wide
// ones, because those two mean something else entirely.
function menuHtml(km, layer){
  const t = menuTarget(km, layer);
  const tabs = PTABS.filter(([v]) => !t.exclude.includes(v));
  const ptab = t.exclude.includes(state.ptab) ? "keyboard" : state.ptab;
  return `<div class="menu"><div class="tabs picktabs">`
    + tabs.map(([v,l]) =>
        (v === BOARD_TABS[0] ? `<span class="sep"></span>` : "")
        + `<button data-ptab="${v}" class="${ptab===v?"sel":""}">${esc(l)}</button>`).join("")
    + `<button class="ghost sm" id="kb-toggle">`
    + `${state.picker ? "Hide" : "Show"}</button>`
    + `<span class="ptarget" id="kb-target"></span></div>`
    + `<div class="picker${state.picker ? "" : " hidden"}" id="kb-picker">`
    + pickerBody(t.cur, ptab) + `</div></div>`;
}

// The input the picker writes into: whichever binding field was focused last.
let activeField = null;

function markPicker(){
  const p = $("#kb-picker");
  if (!p) return;
  const v = ((activeField && activeField.value) || "").trim();
  const t = $("#kb-target"), slot = activeField && activeField.closest(".slot");
  // With the key editor open a pick is not a fill, it is the assignment - say so,
  // or the row promises an Apply step that no longer happens (see `pickBinding()`).
  if (t) t.textContent =
      state.editing !== null && activeField && activeField.id === "kb-val"
        ? `\u2192 assigns key ${state.editing}`
        : slot ? "\u2192 fills " + slot.querySelector("span").textContent
       : "\u2192 nothing to fill: click a key on the board, or open a panel above";
  p.querySelectorAll(".pk[data-bind]").forEach(el =>
      el.classList.toggle("sel", el.dataset.bind === v));
  p.querySelectorAll(".pk[data-vd]").forEach(el =>
      el.classList.toggle("sel", usesVd(v, el.dataset.vd)));
  p.querySelectorAll(".pk[data-mod]").forEach(el => {
    const rec = (STORE.modifier || []).find(x => x.name === el.dataset.mod);
    el.classList.toggle("sel", !!rec && modBinding(rec) === v);
  });
  p.querySelectorAll(".pk[data-lt]").forEach(el => {
    const code = ltCode(v);
    el.classList.toggle("sel", v === `&lt ${el.dataset.lt}${code ? " " + code : ""}`);
  });
  p.querySelectorAll(".pk[data-lay]").forEach(el => {
    const rec = (STORE.layer || []).find(x => x.name === el.dataset.lay);
    el.classList.toggle("sel", !!rec && usesLayer(v, rec));
  });
}

function setField(v){
  if (!activeField){ say("click the field to fill in first", true); return render(); }
  activeField.value = v;
  activeField.dispatchEvent(new Event("input", {bubbles:true}));
  activeField.focus();
  markPicker();
}

// The pending edit for one key. Apply calls this and so does `pickBinding()`,
// so the typed path and the picked one cannot drift apart.
function assignKey(pos, v){
  const b = (v || "").trim();
  const a = state.assign[state.layer] = state.assign[state.layer] || {};
  if (!b) delete a[pos]; else a[pos] = b;
  if (!Object.keys(a).length) delete state.assign[state.layer];
}

// Where a menu pick goes. With the key editor open the pick is already the
// whole answer - clicking A on the Keyboard tab cannot mean anything but
// `&kp A` - so it is assigned and the editor closes; there is nothing Apply
// would have added. Anywhere else it fills the focused field of a panel that
// still has its own Save. Not used by the layer-tap buttons: those compose
// with what is in the field, so they are not finished bindings.
function pickBinding(v){
  if (state.editing === null || !activeField || activeField.id !== "kb-val")
    return setField(v);
  const pos = state.editing;
  assignKey(pos, v);
  state.editing = null;
  say(`key ${pos} \u2192 ${label(v)}`);
  render();
}

// `fields` are the binding inputs this menu may write into - whatever the editor
// area has open, or none at all. The first one is the default target so a
// single-field editor needs no click to get going.
function wireMenu(fields){
  const wrap = $("#kb-picker");
  if (!wrap) return;
  activeField = fields[0] || null;
  fields.forEach(el => {
    el.addEventListener("focus", () => { activeField = el; markPicker(); });
    el.addEventListener("input", markPicker);
  });
  const wireKeys = () => {
    wrap.querySelectorAll(".pk[data-bind]").forEach(el =>
        el.onclick = () => pickBinding(el.dataset.bind));
    wrap.querySelectorAll(".pk[data-vd]").forEach(el => el.onclick = async () => {
      const t = STORE.viledance.find(x => x.name === el.dataset.vd);
      if (!t) return;
      try {
        const r = await api("POST", "/api/preview", {...t, kind:"viledance"});
        pickBinding(r.binding || "");
      } catch (err){ say(err.message, true); render(); }
    });
    wrap.querySelectorAll(".pk[data-mod]").forEach(el => el.onclick = async () => {
      const m = (STORE.modifier || []).find(x => x.name === el.dataset.mod);
      if (!m) return;
      try {
        const r = await api("POST", "/api/preview", {...m, kind:"modifier"});
        pickBinding(r.binding || "");
      } catch (err){ say(err.message, true); render(); }
    });
    wrap.querySelectorAll(".pk[data-lt]").forEach(el => el.onclick = () => {
      const code = ltCode(activeField && activeField.value);
      setField(`&lt ${el.dataset.lt}${code ? " " + code : ""}`);
      // The hint line and every other layer-tap button quote that keycode.
      wrap.innerHTML = pickerBody(((activeField && activeField.value) || "").trim());
      wireKeys();
    });
    wrap.querySelectorAll(".pk[data-lay]").forEach(el => el.onclick = async () => {
      const l = (STORE.layer || []).find(x => x.name === el.dataset.lay);
      if (!l) return;
      try {
        const r = await api("POST", "/api/preview", {...l, kind:"layer"});
        pickBinding(r.binding || "");
      } catch (err){ say(err.message, true); render(); }
    });
    // `+ New \u2026` and a card's \u270e both open the real creation panel in the
    // editor area above - which closes the key editor, since only one of the two
    // can be up there at a time. The draft is per-kind, so nothing else is lost.
    wrap.querySelectorAll("[data-new]").forEach(el => el.onclick = () => {
      const m = el.dataset.new;
      state.emode = m; state.drafts[m] = BLANK[m]();
      state.editing = null; state.dts = null; say(null); render();
    });
    // Same slot, the draft that is already there - see `newRow()`.
    wrap.querySelectorAll("[data-open]").forEach(el => el.onclick = () => {
      state.emode = el.dataset.open;
      state.editing = null; state.dts = null; say(null); render();
    });
    wrap.querySelectorAll("[data-edit]").forEach(el => el.onclick = () => {
      const m = el.dataset.edit, rec = recordOf(m, el.dataset.name);
      if (!rec) return;
      state.emode = m; state.drafts[m] = JSON.parse(JSON.stringify(rec));
      state.editing = null; state.dts = null; say(null); render();
    });
    // The board-wide switch. `scopes` lives in the record, so flipping it is an
    // ordinary save - and the response carries the whole store back, as always.
    wrap.querySelectorAll("[data-tgl]").forEach(el => el.onclick = async () => {
      const m = el.dataset.tgl, rec = recordOf(m, el.dataset.name);
      const scope = scopeOf(byId(state.id));
      if (!rec) return;
      if (!scope){ say("pick a keyboard first", true); return render(); }
      const kind = KIND_OF[m], now = !scopeOn(rec, scope);
      try {
        const r = await api("POST", "/api/" + kind,
                            {...rec, kind, scopes: {...(rec.scopes||{}), [scope]: now}});
        STORE = r.custom;
        say(`${rec.name} is now ${now ? "on" : "off"} for ${scope}`);
      } catch (err){ say(err.message, true); }
      render();
    });
    markPicker();
  };
  wireKeys();
  $("#kb-toggle").onclick = e => {
    state.picker = !state.picker;
    wrap.classList.toggle("hidden", !state.picker);
    e.target.textContent = state.picker ? "Hide" : "Show";
  };
  document.querySelectorAll("[data-ptab]").forEach(b => b.onclick = () => {
    state.ptab = b.dataset.ptab;
    document.querySelectorAll("[data-ptab]").forEach(o =>
        o.classList.toggle("sel", o.dataset.ptab === state.ptab));
    wrap.innerHTML = pickerBody(((activeField && activeField.value) || "").trim());
    wireKeys();
  });
}

function keyEditor(km, layer){
  const pos = state.editing;
  if (pos === null || pos === undefined) return "";
  const orig = layer ? layer.bindings[pos] : "";
  const cur = (state.assign[state.layer] || {})[pos] ?? orig;
  return `<div class="panel" id="keyed" style="margin:0 0 16px">`
    + `<h3>Key ${pos} &middot; layer ${state.layer} &middot; now <code>${esc(orig||"")}</code></h3>`
    + `<div class="slot"><span>Binding</span>`
    + `<input class="kb wide" id="kb-val" value="${esc(cur||"")}" autocomplete="off"></div>`
    + `<div class="rowbtns"><button class="act" id="kb-ok">Apply</button>`
    + `<button class="ghost" id="kb-reset">Reset to ${esc(label(orig||""))}</button>`
    + `<button class="ghost" id="kb-cancel">Cancel</button></div>`
    + `<div class="hint">Pick from the menu below - a key, a saved VileDance, a`
    + ` macro, a modifier or a layer - and it is assigned straight away, no Apply.`
    + ` Or type any ZMK binding here - <code>&amp;kp A</code>,`
    + ` <code>&amp;mo 2</code>, <code>&amp;none</code> - and press Apply or Enter.`
    + ` Either way nothing touches disk until you save a variant.</div></div>`;
}

function wireKeyEditor(km){
  const val = $("#kb-val");
  if (!val) return;
  val.focus();
  val.onkeydown = e => { if (e.key === "Enter") $("#kb-ok").click();
                         if (e.key === "Escape") $("#kb-cancel").click(); };
  $("#kb-ok").onclick = () => {
    assignKey(state.editing, val.value);
    state.editing = null; say(null); render();
  };
  $("#kb-reset").onclick = () => {
    delete (state.assign[state.layer] || {})[state.editing];
    if (state.assign[state.layer] && !Object.keys(state.assign[state.layer]).length)
      delete state.assign[state.layer];
    state.editing = null; render();
  };
  $("#kb-cancel").onclick = () => { state.editing = null; render(); };
}

// `over` is the variant's own name when saving in place, and undefined when
// saving as a new one. `scope` is the keymap the board-wide switches were
// flipped under: the server carries those flags across to the variant it writes,
// so combos switched on while composing land in the file (see ui-server.md).
async function saveVariant(km, over){
  const name = over || ($("#vname").value || "").trim();
  if (!name) return say("give the variant a name", true) || render();
  if (!over && DATA.keymaps.some(k => k.kind === "variant" && k.name === slugify(name))
      && !confirm(`variants/${slugify(name)}/ already exists. Overwrite it?`))
    return render();
  try {
    const r = await api("POST", "/api/variant",
                        {name, base: km.id, assignments: state.assign,
                         scope: scopeOf(km),
                         new_layers: state.newLayers[km.id] || []});
    if (r.custom) STORE = r.custom;
    state.assign = {};
    state.newLayers[km.id] = [];
    // Pull the fresh keymap list so the new file shows up in "Saved
    // variations" without a page reload, and jump straight to it - matching
    // by filename since `r.wrote` is project-relative while a keymap's `id`
    // carries the full discovered path (see discover() in the Python half).
    const fresh = await api("GET", "/api/state");
    DATA.keymaps = fresh.keymaps;
    DATA.generated = fresh.generated;
    STORE = fresh.custom || STORE;
    const fn = r.wrote.split("/").pop();
    const created = DATA.keymaps.find(k => k.kind === "variant" && k.path.split("/").pop() === fn);
    if (created){ state.id = created.id; state.layer = 0; }
    // A variant is a folder: the keymap, and the build.yaml that builds it.
    say(`wrote ${r.folder || r.wrote}`
        + (r.build ? " (keymap + build.yaml)" : "")
        + (r.warnings && r.warnings.length ? " - " + r.warnings.join("; ") : ""));
  } catch (e){ say(e.message, true); }
  sidebar(); render();
}

// Deleting is ours to offer only because `variants/` is ours to write: the
// server's `delete_variant()` builds the path itself, so nothing outside that
// directory is reachable from here. It removes the two files a variant is made
// of and the folder only if that empties it, so anything else you put in there
// survives. The keymap list is pulled fresh afterwards and the selection moves
// to whatever is left.
async function deleteVariant(km){
  if (km.kind !== "variant") return;
  if (!confirm(`Delete variants/${km.name}/ - keymap and build.yaml? `
               + `This cannot be undone.`)) return;
  try {
    const r = await api("DELETE", `/api/variant/${encodeURIComponent(km.name)}`);
    if (r.custom) STORE = r.custom;
    const fresh = await api("GET", "/api/state");
    DATA.keymaps = fresh.keymaps; DATA.generated = fresh.generated;
    STORE = fresh.custom || STORE;
    state.assign = {}; delete state.newLayers[km.id];
    state.id = (DATA.keymaps[0] || {}).id || null;
    state.layer = 0; state.layout = 0;
    say(`deleted variants/${km.name}/`);
  } catch (e){ say(e.message, true); }
  sidebar(); render();
}

// ------------------------------------------------------- the editor area
// One slot, directly under the board and above the menu. It holds at most one
// thing: the clicked key's editor, or a creation panel for one of the five
// kinds. Opening either closes the other - there is nowhere to put two.
const BLANK = {
  viledance: () => ({name:"", tap:"", hold:"", double_tap:"", tap_hold:"",
                    tapping_term_ms:200, flavor:"tap-preferred"}),
  macro:    () => ({name:"", steps:[{action:"text", text:""}],
                    wait_ms:0, tap_ms:0}),
  combo:    () => ({name:"", binding:"", timeout_ms:50, key_positions:[],
                    layers:[], scopes:{}}),
  modifier: () => ({name:"", mods:[], param:""}),
  layer:    () => ({name:"", mode:"lt", layer:0, key:"", tapping_term_ms:0,
                    flavor:""}),
  conditional: () => ({name:"", mode:"conditional", if_layers:[], then_layer:0,
                    scopes:{}})
};
const SLOTS = [["tap","On tap"], ["hold","On hold"],
               ["double_tap","On double tap"], ["tap_hold","On tap + hold"]];

// A conditional layer is its own editor mode even though it saves as kind
// "layer": the two shapes share nothing but a name, and after the merge they
// live in different tabs. This is the one place the two vocabularies meet.
const KIND_OF = {viledance:"viledance", macro:"macro", combo:"combo",
                 modifier:"modifier", layer:"layer", conditional:"layer"};

// Drafts are per mode, not one shared `pick`. Clicking a key, or switching to
// another kind's tab, must not throw away a half-typed combo.
function draftOf(mode){
  if (!state.drafts[mode]) state.drafts[mode] = BLANK[mode]();
  return state.drafts[mode];
}

// The saved record behind a card or a board-wide row. `conditional` and `layer`
// share one store and are told apart by `mode`, the same split `layerHtml()` and
// `conditionalHtml()` make when they list them.
function recordOf(mode, name){
  const items = STORE[KIND_OF[mode]] || [];
  if (mode === "layer")
    return items.find(r => r.name === name && (r.mode||"lt") !== "conditional");
  if (mode === "conditional")
    return items.find(r => r.name === name && (r.mode||"lt") === "conditional");
  return items.find(r => r.name === name);
}

const PANEL_TITLES = {viledance:"VileDance", macro:"Macro", combo:"Combo",
                      modifier:"Modifier", layer:"Layer-tap",
                      conditional:"Conditional layer"};

function editorHtml(km, layer){
  if (state.editing !== null) return keyEditor(km, layer);
  if (!state.emode) return "";
  const d = draftOf(state.emode);
  const panel = state.emode === "viledance" ? viledancePanel(d)
              : state.emode === "macro" ? macroPanel(d)
              : state.emode === "combo" ? comboPanel(d)
              : state.emode === "modifier" ? modifierPanel(d)
              : state.emode === "conditional" ? condPanel(d, km)
              : layerTapPanel(d, km);
  return `<div class="editor" style="margin-bottom:16px">` + panel + `</div>`
       + (state.dts ? `<pre class="dts">${esc(state.dts)}</pre>` : "");
}

function viledancePanel(d){
  return `<div class="panel"><h3>${PANEL_TITLES.viledance}</h3>`
    + `<div class="slot"><span>Name</span>`
    + `<input class="kb wide" id="f-name" value="${esc(d.name)}" placeholder="e.g. bkspshift"></div>`
    + SLOTS.map(([k, lbl]) =>
        `<div class="slot"><span>${lbl}</span>`
        + `<input class="kb" data-f="${k}" value="${esc(d[k]||"")}"`
        + ` placeholder="${k==="tap"?"&kp BSPC":""}"></div>`).join("")
    + `<div class="slot"><span>Tapping term (ms)</span>`
    + `<input class="kb sm" data-f="tapping_term_ms" value="${esc(d.tapping_term_ms??200)}"></div>`
    + `<div class="slot"><span>Flavor</span><select class="kb wide" data-f="flavor">`
    + ["tap-preferred","hold-preferred","balanced","tap-unless-interrupted"].map(f =>
        `<option ${f===d.flavor?"selected":""}>${f}</option>`).join("")
    + `</select></div>`
    + `<div class="hint">Fill <b>on tap</b> alone and it is just a key. Add <b>on hold</b>`
    + ` and it becomes a hold-tap. Add <b>on double tap</b> and it becomes a VileDance`
    + ` holding one or two hold-taps - <b>on tap + hold</b> needs <b>on double tap</b>`
    + ` filled too, since they're the same second press. Each slot takes a full ZMK`
    + ` binding (<code>&amp;kp BSPC</code>, <code>&amp;mo 2</code>) and, in a hold slot,`
    + ` must be a behavior of exactly one parameter. The <b>on tap + hold</b> row always`
    + ` uses the <code>balanced</code> flavor regardless of the setting above, so a held`
    + ` layer key engages right away instead of waiting out the term twice. Click a slot,`
    + ` then pick from the menu below.</div>`
    + buttons() + `</div>`;
}

// The one panel whose fields are a *list*, which is the one thing the panel
// machinery had no shape for. Each row is still an ordinary `.slot` with a
// `data-f` input, so the menu fills whichever was focused last and `markPicker()`
// can name it - the only new part is that `data-f` carries an index here
// (`step:2`, `text:0`, `ms:1`), parsed by `wirePanel()`.
const STEP_LABELS = {tap:"Tap", press:"Press", release:"Release",
                     wait:"Wait (ms)", pause:"Pause", text:"Text"};
const STEP_ADD = ["text", "tap", "press", "release", "wait", "pause"];
const BLANK_STEP = a => a === "text" ? {action:"text", text:""}
                      : a === "wait" ? {action:"wait", ms:50}
                      : a === "pause" ? {action:"pause"} : {action:a, binding:""};
// Where the caret goes after a step is added - each kind of row has its own
// field name, and `pause` has no field at all.
const stepField = (a, i) => a === "text" ? `text:${i}` : a === "wait" ? `ms:${i}`
                          : a === "pause" ? null : `step:${i}`;

function stepRow(s, i, n){
  const field =
      s.action === "text"
        ? `<input class="kb wide" data-f="text:${i}" value="${escA(s.text||"")}"`
          + ` placeholder="type the text here">`
    : s.action === "wait"
        ? `<input class="kb sm" data-f="ms:${i}" value="${esc(s.ms ?? 50)}">`
    : s.action === "pause"
        ? `<div class="path">holds here until the key is released</div>`
        : `<input class="kb" data-f="step:${i}" value="${escA(s.binding||"")}"`
          + ` placeholder="&kp A">`;
  return `<div class="slot"><span>${i+1}. ${esc(STEP_LABELS[s.action] || s.action)}`
    + `</span>` + field
    + `<button type="button" class="ghost sm" data-mv="up:${i}"`
    + `${i ? "" : " disabled"}>&uarr;</button>`
    + `<button type="button" class="ghost sm" data-mv="down:${i}"`
    + `${i < n-1 ? "" : " disabled"}>&darr;</button>`
    + `<button type="button" class="ghost sm danger" data-rm="${i}">&times;</button>`
    + `</div>`;
}

function macroPanel(d){
  const steps = d.steps || [];
  return `<div class="panel"><h3>${PANEL_TITLES.macro}</h3>`
    + `<div class="slot"><span>Name</span>`
    + `<input class="kb wide" id="f-name" value="${esc(d.name)}" placeholder="e.g. email">`
    + `</div>`
    + (steps.length ? steps.map((s, i) => stepRow(s, i, steps.length)).join("")
                    : `<div class="hint">No steps yet - add one below.</div>`)
    + `<div class="modrow">` + STEP_ADD.map(a =>
        `<button type="button" class="ghost sm" data-add="${a}">+ ${a}</button>`).join("")
    + `</div>`
    + `<div class="slot"><span>Wait between (ms)</span>`
    + `<input class="kb sm" data-f="wait_ms" value="${esc(d.wait_ms||"")}"`
    + ` placeholder="15 - built-in"></div>`
    + `<div class="slot"><span>Tap length (ms)</span>`
    + `<input class="kb sm" data-f="tap_ms" value="${esc(d.tap_ms||"")}"`
    + ` placeholder="30 - built-in"></div>`
    + `<div class="hint"><b>Text</b> is the short way to say "type this": it is`
    + ` expanded into one tap per character when the keymap is written, so`
    + ` <code>a@b.com</code> stays one step here instead of seven.`
    + ` <b>Tap</b>, <b>Press</b> and <b>Release</b> each take a whole binding - click`
    + ` the row, then pick it from the menu below - and press/release come in pairs`
    + ` around the keys they apply to. <b>Wait</b> pauses mid-sequence;`
    + ` <b>Pause</b> stops there until the key the macro is on is released, which is`
    + ` how a macro holds something down for as long as you do. ZMK's queue holds 64`
    + ` behaviors and a tap costs two - go over and saving says so rather than`
    + ` letting the firmware stop half way.</div>`
    + buttons() + `</div>`;
}

function comboPanel(d){
  return `<div class="panel"><h3>${PANEL_TITLES.combo}</h3>`
    + `<div class="slot"><span>Name</span>`
    + `<input class="kb wide" id="f-name" value="${esc(d.name)}" placeholder="e.g. jk_quote"></div>`
    + `<div class="slot"><span>Keys</span>`
    + `<input class="kb wide" data-f="key_positions" value="${esc((d.key_positions||[]).join(" "))}"`
    + ` placeholder="click the board above"></div>`
    + `<div class="slot"><span>Output key</span>`
    + `<input class="kb" data-f="binding" value="${esc(d.binding||"")}" placeholder="&kp SQT"></div>`
    + `<div class="slot"><span>Timeout (ms)</span>`
    + `<input class="kb sm" data-f="timeout_ms" value="${esc(d.timeout_ms??50)}"></div>`
    + `<div class="slot"><span>Layers</span>`
    + `<input class="kb wide" data-f="layers" value="${esc((d.layers||[]).join(" "))}"`
    + ` placeholder="blank = all layers"></div>`
    + `<div class="hint">While this panel is open the <b>board above is the chord`
    + ` picker</b> - click keys on it to add and remove positions. ZMK identifies combo`
    + ` keys by position, not by what they currently send, so the positions are what`
    + ` gets written. The <b>output key</b> is an ordinary binding: fill it from the`
    + ` menu below. A combo goes on no key of its own, so it is written into a variant`
    + ` when it is switched <b>On</b> in the <b>Combos</b> tab.</div>`
    + buttons() + `</div>`;
}

// The modifier chain is built by clicking, not picked from the shared menu: it is
// eight buttons and a nesting order, nothing the keyboard grid could express. They
// sit in the panel itself now, so the menu below is free to fill `Parameter`.
function modifierPanel(d){
  const mods = d.mods || [];
  const full = mods.length >= 3;
  return `<div class="panel"><h3>${PANEL_TITLES.modifier}</h3>`
    + `<div class="slot"><span>Name</span>`
    + `<input class="kb wide" id="f-name" value="${esc(d.name)}" placeholder="e.g. ctrl_shift_a"></div>`
    + `<div class="slot"><span>Modifier</span>`
    + `<input class="kb wide" data-f="mod" value="${esc(modChainText(mods))}"`
    + ` placeholder="click a modifier below"></div>`
    + `<div class="modrow">`
    + MODS.map(m => `<button type="button" class="pk td mkey${full ? " off" : ""}"`
        + ` data-mkey="${m}" title="${esc(MOD_LABELS[m])}">`
        + `<span>${MOD_LABELS[m]}</span><span class="up">${m}</span></button>`).join("")
    + (mods.length
        ? `<button type="button" class="ghost sm" id="mod-undo">&larr; remove last</button>`
          + `<button type="button" class="ghost sm" id="mod-clear">clear</button>`
        : "")
    + `</div>`
    + `<div class="slot"><span>Parameter</span>`
    + `<input class="kb" data-f="param" value="${esc(d.param||"")}" placeholder="&kp A"></div>`
    + `<div class="hint">Click up to three modifiers to nest them`
    + ` (${full ? "three is the limit - " : ""}<code>LS</code>/<code>RS</code> shift,`
    + ` <code>LC</code>/<code>RC</code> control, <code>LA</code>/<code>RA</code> alt,`
    + ` <code>LG</code>/<code>RG</code> gui, left or right, outermost first), then fill`
    + ` <b>Parameter</b> from the menu below - the key they wrap. This bakes the result`
    + ` in as plain ZMK text wherever it is picked: editing a saved modifier later does`
    + ` not change keys that already used it; re-pick it to update them.</div>`
    + buttons() + `</div>`;
}

// A layer number field: this keyboard's own layers by name when one is selected,
// a plain number when none is (a layer entry is worth writing either way - the
// generated keymap only cares about the index).
function layerSelect(km, field, value){
  const all = layersOf(km);
  if (!all.length)
    return `<input class="kb sm" data-f="${field}" value="${esc(value ?? 0)}"`
         + ` placeholder="0">`;
  return `<select class="kb wide" data-f="${field}">` + all.map((l,i) =>
      `<option value="${i}" ${i === (+value||0) ? "selected" : ""}>`
      + `${i} &middot; ${esc(l.display)}</option>`).join("") + `</select>`;
}

// The two layer shapes have their own panels now, because they have their own
// tabs: a layer-tap goes on a key and is picked from the Layers tab, a
// conditional layer goes on none and is switched on in the Conditional layers
// tab. There is no "kind" select left to get them confused.
function layerTapPanel(d, km){
  return `<div class="panel"><h3>${PANEL_TITLES.layer}</h3>`
    + `<div class="slot"><span>Name</span>`
    + `<input class="kb wide" id="f-name" value="${esc(d.name)}"`
    + ` placeholder="e.g. nav_space"></div>`
    + `<div class="slot"><span>Layer</span>` + layerSelect(km, "layer", d.layer) + `</div>`
    + `<div class="slot"><span>Tap key</span>`
    + `<input class="kb" data-f="key" value="${esc(d.key||"")}"`
    + ` placeholder="&kp SPACE"></div>`
    + `<div class="slot"><span>Tapping term (ms)</span>`
    + `<input class="kb sm" data-f="tapping_term_ms"`
    + ` value="${esc(d.tapping_term_ms||"")}" placeholder="200 - built-in"></div>`
    + `<div class="slot"><span>Flavor</span><select class="kb wide" data-f="flavor">`
    + [["","balanced - built-in"], ["balanced","balanced"],
       ["tap-preferred","tap-preferred"], ["hold-preferred","hold-preferred"],
       ["tap-unless-interrupted","tap-unless-interrupted"]].map(([v,l]) =>
        `<option value="${v}" ${v===(d.flavor||"")?"selected":""}>${l}</option>`).join("")
    + `</select></div>`
    + `<div class="hint">Tap it for the key, hold it for the layer - and the`
    + ` <b>Layers</b> tab below makes one of these without saving anything, so this`
    + ` panel is for the ones worth a name, and for the timing below. Leave the term`
    + ` and flavor alone and this is ZMK's own <code>&amp;lt</code> - nothing is`
    + ` generated, and the tap has to be a plain keycode. Set either one and it becomes`
    + ` a generated hold-tap (<code>lt_&lt;name&gt;</code>) holding <code>&amp;mo</code>`
    + ` over your tap key, which is what <code>&amp;lt</code> is anyway - that version`
    + ` can tap any behavior of exactly one parameter. Click <b>Tap key</b>, then pick`
    + ` from the menu below.</div>`
    + buttons() + `</div>`;
}

function condPanel(d, km){
  return `<div class="panel"><h3>${PANEL_TITLES.conditional}</h3>`
    + `<div class="slot"><span>Name</span>`
    + `<input class="kb wide" id="f-name" value="${esc(d.name)}"`
    + ` placeholder="e.g. tri_layer"></div>`
    + `<div class="slot"><span>If layers</span>`
    + `<input class="kb wide" data-f="if_layers"`
    + ` value="${esc((d.if_layers||[]).join(" "))}" placeholder="1 2"></div>`
    + `<div class="slot"><span>Then layer</span>`
    + layerSelect(km, "then_layer", d.then_layer) + `</div>`
    + `<div class="hint">Hold <b>all</b> of the <b>if</b> layers at once and <b>then`
    + ` layer</b> activates on top - the tri-layer trick: hold 1 and 2 together to get`
    + ` 3. Two or more if-layers, and the then-layer cannot be one of them. This goes`
    + ` on no key: it is a <code>zmk,conditional-layers</code> node watching the layers`
    + ` the rest of your keymap already turns on, so nothing here can reference it and`
    + ` nothing below fills a field. Whether it reaches a variant is the <b>On</b>/`
    + `<b>Off</b> switch on its row in the <b>Conditional layers</b> tab.</div>`
    + buttons() + `</div>`;
}

const buttons = () => `<div class="rowbtns">`
  + `<button class="act" id="save">Save</button>`
  + `<button class="ghost" id="preview">Devicetree</button>`
  + `<button class="ghost" id="close">Close</button>`
  + `<button class="ghost danger" id="del">Delete</button></div>`;

// The binding inputs the menu below may write into: whichever of the six things
// the editor area has open, or none.
function menuFields(){
  if (state.editing !== null) return [$("#kb-val")].filter(Boolean);
  if (state.emode === "viledance")
    return SLOTS.map(([k]) => $(`[data-f="${k}"]`)).filter(Boolean);
  if (state.emode === "macro")
    return [...document.querySelectorAll('[data-f^="step:"]')];
  if (state.emode === "combo") return [$('[data-f="binding"]')].filter(Boolean);
  if (state.emode === "modifier") return [$('[data-f="param"]')].filter(Boolean);
  if (state.emode === "layer") return [$('[data-f="key"]')].filter(Boolean);
  return [];
}

function wireEditor(km, layer){
  wireKeyEditor(km);
  if (state.editing === null && state.emode) wirePanel(km);
  wireMenu(menuFields());
}

function wirePanel(km){
  const mode = state.emode, kind = KIND_OF[mode], d = draftOf(mode);
  const nameEl = $("#f-name");
  if (nameEl) nameEl.oninput = e => { d.name = e.target.value; };
  $("#main").querySelectorAll("[data-f]").forEach(el => {
    el.oninput = el.onchange = e => {
      const f = el.dataset.f, v = e.target.value;
      // A macro step: the only `data-f` that carries an index.
      const st = /^(step|text|ms):(\d+)$/.exec(f);
      if (st){
        const step = (d.steps || [])[+st[2]];
        if (!step) return;
        if (st[1] === "step") step.binding = v;
        else if (st[1] === "text") step.text = v;
        else step.ms = +v || 0;
        return;
      }
      if (f === "key_positions" || f === "layers" || f === "if_layers")
        d[f] = v.split(/[\s,]+/).filter(Boolean).map(Number);
      else if (f === "timeout_ms" || f === "tapping_term_ms" || f === "layer"
               || f === "then_layer" || f === "wait_ms" || f === "tap_ms")
        d[f] = +v || 0;
      else if (f === "mod") d.mods = parseModChain(v);
      else d[f] = v;
      // The board's `.pick` highlighting mirrors this field, so it has to redraw.
      if (f === "key_positions"){ state.refocus = f; render(); }
    };
  });
  $("#main").querySelectorAll(".modrow [data-mkey]").forEach(el => el.onclick = () => {
    if ((d.mods||[]).length >= 3) return;
    d.mods = [...(d.mods||[]), el.dataset.mkey];
    state.refocus = "mod"; render();
  });
  // The steps list. Every one of these re-renders the page, so the caret is put
  // back the same way the modifier chain does it - `state.refocus`.
  $("#main").querySelectorAll("[data-add]").forEach(el => el.onclick = () => {
    const a = el.dataset.add;
    d.steps = [...(d.steps || []), BLANK_STEP(a)];
    state.refocus = stepField(a, d.steps.length - 1);
    render();
  });
  $("#main").querySelectorAll("[data-rm]").forEach(el => el.onclick = () => {
    d.steps = (d.steps || []).filter((_, i) => i !== +el.dataset.rm);
    render();
  });
  $("#main").querySelectorAll("[data-mv]").forEach(el => el.onclick = () => {
    const [dir, at] = el.dataset.mv.split(":");
    const steps = d.steps || [], i = +at, j = dir === "up" ? i - 1 : i + 1;
    if (j < 0 || j >= steps.length) return;
    [steps[i], steps[j]] = [steps[j], steps[i]];
    state.refocus = stepField(steps[j].action, j);
    render();
  });
  const undo = $("#mod-undo");
  if (undo) undo.onclick = () => {
    d.mods = (d.mods||[]).slice(0,-1); state.refocus = "mod"; render(); };
  const clr = $("#mod-clear");
  if (clr) clr.onclick = () => { d.mods = []; state.refocus = "mod"; render(); };
  $("#save").onclick = () => saveItem(mode, kind, d);
  $("#preview").onclick = () => previewItem(kind, d);
  $("#del").onclick = () => deleteItem(mode, kind, d);
  $("#close").onclick = () => { state.emode = null; state.dts = null; say(null); render(); };
}

async function saveItem(mode, kind, d){
  // A brand-new board-wide record is switched on for the keymap it was designed
  // against and nowhere else - that is the "off unless you say so" rule, minus
  // the pointless step of switching on the one you are obviously making it for.
  // An existing record's scopes are left exactly as they are.
  if (BOARD_TABS.includes(mode) && !recordOf(mode, d.name)){
    const scope = scopeOf(byId(state.id));
    if (scope) d.scopes = {...(d.scopes || {}), [scope]: true};
  }
  try {
    const r = await api("POST", "/api/" + kind, {...d, kind});
    STORE = r.custom; say("saved " + r.saved);
  } catch (e){ say(e.message, true); }
  render();
}

async function previewItem(kind, d){
  try {
    const r = await api("POST", "/api/preview", {...d, kind});
    state.dts = r.dts || "(nothing to generate - this is just a plain key)";
    say(null);
  } catch (e){ state.dts = null; say(e.message, true); }
  render();
}

async function deleteItem(mode, kind, d){
  if (!d.name) return;
  if (!confirm(`Delete ${kind} "${d.name}"?`)) return;
  try {
    const r = await api("DELETE", `/api/${kind}/${encodeURIComponent(d.name)}`);
    STORE = r.custom; state.drafts[mode] = BLANK[mode](); say("deleted");
  } catch (e){ say(e.message, true); }
  render();
}

$("#filter").oninput = sidebar;
state.id = (DATA.keymaps[0] || {}).id || null;
sidebar(); render();
</script>
</body>
</html>
