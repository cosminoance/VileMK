<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VileMK &middot; __REPO__</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --ink:#15181d; --muted:#69707d; --line:#dfe3ea;
  --key:#fff; --key-line:#c8cfda; --accent:#2f6feb; --accent-soft:#e5edfd;
  --warn:#8a5a00; --warn-soft:#fff4d9; --diff:#b8860b; --diff-soft:#fdf1cf;
  --combo:#0a7a5a; --combo-soft:#d8f3e9;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14171c; --panel:#1b1f26; --ink:#e7eaef; --muted:#98a1b0; --line:#2c323c;
    --key:#232935; --key-line:#39414f; --accent:#6f9dff; --accent-soft:#1e2b46;
    --warn:#f0c46a; --warn-soft:#3a2f13; --diff:#e8bd5a; --diff-soft:#3b3116;
    --combo:#5fd3ae; --combo-soft:#12332a;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:12px;align-items:baseline;padding:10px 16px;
  border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header h1{font-size:15px;margin:0;font-weight:600}
header .meta{color:var(--muted);font-size:12px}
.wrap{display:flex;align-items:flex-start}
aside{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  height:calc(100vh - 42px);overflow:auto;position:sticky;top:42px;padding:10px}
aside input{width:100%;padding:6px 8px;margin-bottom:8px;border:1px solid var(--line);
  border-radius:6px;background:var(--bg);color:var(--ink)}
aside .group{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin:12px 0 4px}
aside button{display:block;width:100%;text-align:left;padding:6px 8px;border:0;
  border-radius:6px;background:none;color:var(--ink);cursor:pointer;font:inherit}
aside button:hover{background:var(--bg)}
aside button.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
aside button small{display:block;color:var(--muted);font-weight:400;font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{flex:1;min-width:0;padding:16px 20px 60px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar h2{margin:0;font-size:17px}
.bar .path{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace}
select,.toggle{padding:5px 8px;border:1px solid var(--line);border-radius:6px;
  background:var(--panel);color:var(--ink);font:inherit}
label.toggle{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.tabs button{padding:5px 12px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel);color:var(--ink);cursor:pointer;font:inherit}
.tabs button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.board{position:relative;margin:0 0 18px}
.k{position:absolute;border:1px solid var(--key-line);border-radius:5px;
  background:var(--key);overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:2px}
.k .lbl{font-size:11px;line-height:1.15;word-break:break-word;font-family:ui-monospace,monospace}
/* The shifted legend, printed where a real keycap prints it: above the plain
   one, exactly like the picker's `.up`. Deliberately NOT `.hint`'s accent - a
   hint is another outcome of the binding, this is the same outcome with shift
   held, which is the OS's doing and not the keymap's. */
.k .shift{font-size:9px;line-height:1.1;color:var(--muted);font-family:ui-monospace,monospace}
.k .pos{position:absolute;top:1px;left:3px;font-size:9px;color:var(--muted)}
.k .hint{position:absolute;top:1px;right:3px;font-size:9px;color:var(--accent);
  font-family:ui-monospace,monospace}
.k .was{position:absolute;bottom:1px;left:0;right:0;font-size:9px;color:var(--diff);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,monospace}
.k.diff{border-color:var(--diff);background:var(--diff-soft)}
.k.diff .lbl,.k.diff .shift{transform:translateY(-4px)}
.k.hot{border-color:var(--combo);background:var(--combo-soft)}
.k.empty{opacity:.45}
.k.compound{border-style:dashed}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;min-width:280px;flex:1}
section.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500}
tr.combo:hover{background:var(--combo-soft)}
tr.usedby:hover{background:var(--accent-soft)}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:6px 10px;
  margin-bottom:10px;font-size:12px}
.legend{color:var(--muted);font-size:12px;margin-bottom:10px}
.editor{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:16px 18px;min-width:330px}
.panel h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted)}
.slot{display:flex;align-items:center;gap:14px;margin:9px 0}
.slot > span{color:var(--muted);font-size:13px;text-align:right;width:120px;flex:none}
.kb{width:132px;height:46px;text-align:center;border:2px solid var(--key-line);
  border-radius:8px;background:var(--key);color:var(--ink);
  font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
.kb:focus{outline:none;border-color:var(--accent)}
.kb.sm{width:86px;height:30px;border-width:1px;text-align:left;padding:0 8px}
.kb.wide{width:200px;height:30px;border-width:1px;text-align:left;padding:0 8px}
.hint{color:var(--muted);font-size:12px;margin-top:12px;max-width:420px}
.rowbtns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
button.act{padding:6px 14px;border:1px solid var(--accent);background:var(--accent);
  color:#fff;border-radius:6px;cursor:pointer;font:inherit}

  color:var(--ink);border-radius:6px;cursor:pointer;font:inherit}
button.danger{border-color:#c0392b;color:#c0392b;background:none}
pre.dts{background:var(--bg);border:1px solid var(--line);border-radius:6px;
  padding:10px;overflow:auto;font-size:11px;max-height:340px;margin:10px 0 0}
.items button{display:block;width:100%;text-align:left;padding:6px 8px;border:0;
  border-radius:6px;background:none;color:var(--ink);cursor:pointer;font:inherit}
.items button:hover{background:var(--bg)}
.items button.sel{background:var(--accent-soft);color:var(--accent);font-weight:600}
.items button small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.k.pick{border-color:var(--combo);background:var(--combo-soft);cursor:pointer}

.k.clickable{cursor:pointer}
.picktabs{margin:0 0 8px;align-items:center}
.picktabs button{font-size:12px;padding:4px 12px}
.ptarget{color:var(--muted);font-size:12px;margin-left:8px}
button.ghost.sm{padding:3px 10px;font-size:12px;margin-left:6px}
.tdlist{display:flex;flex-wrap:wrap;gap:6px}

.picker .prow.extra{margin-top:12px}
.picker .pgroup{margin:0 0 14px}
.picker .pgroup h4{margin:0 0 2px;font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--muted);font-weight:600}
.picker .pnote{color:var(--muted);font-size:11px;margin:0 0 6px;max-width:640px}
.picker .pk{height:38px;flex:none;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:0 3px;text-align:center;cursor:pointer;
  border:1px solid var(--key-line);border-radius:5px;background:var(--key);
  color:var(--ink);font:11px/1.15 ui-sans-serif,system-ui,sans-serif}
.picker .pk:hover{border-color:var(--accent);background:var(--accent-soft)}
.picker .pk.sel{border-color:var(--accent);background:var(--accent);color:#fff}
.picker .pk .up{font-size:10px;color:var(--muted)}
.picker .pk.sel .up{color:#fff}
.picker .sp{flex:none}
.menu{margin-top:20px;border-top:1px solid var(--line);padding-top:14px}
.menu > .tabs{margin-top:0}
.tabs .sep{width:1px;align-self:stretch;background:var(--key-line);margin:0 9px}
.pkg{display:inline-flex;align-items:stretch}
.pkg .pk{border-top-right-radius:0;border-bottom-right-radius:0}
.pkedit{border:1px solid var(--key-line);border-left:0;border-radius:0 5px 5px 0;
  background:var(--key);color:var(--muted);cursor:pointer;padding:0 8px;
  font:11px/1 ui-sans-serif,system-ui,sans-serif}
.pkedit:hover{color:var(--accent);border-color:var(--accent)}
#kb-picker > .hint{max-width:640px}
.blist{display:flex;flex-direction:column;gap:6px;max-width:640px}
.brow{display:flex;align-items:stretch;gap:8px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);padding:4px}
.brow.off{opacity:.55}
.brow .bopen{flex:1;text-align:left;border:0;background:none;color:var(--ink);
  cursor:pointer;font:inherit;padding:4px 6px;border-radius:6px}
.brow .bopen:hover{background:var(--bg)}
.brow .nm{font-weight:600;font-size:13px}

  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  text-transform:uppercase;letter-spacing:.06em}
.tgl.on{border:1px solid var(--combo);background:var(--combo-soft);color:var(--combo)}
.tgl.off{border:1px solid var(--line);background:var(--bg);color:var(--muted)}
.modrow{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 134px}
.msg{border-radius:6px;padding:6px 10px;margin:10px 0;font-size:12px}
.msg.ok{background:var(--combo-soft);color:var(--combo)}
.msg.bad{background:var(--warn-soft);color:var(--warn)}

<body>
<header>
  <h1>VileMK</h1>
  <span class="meta">__REPOPATH__ &middot; generated __GENERATED__ &middot; <span id="mode"></span></span>
</header>
<div class="wrap">
  <aside>
    <input id="filter" placeholder="filter keyboards&hellip;" autocomplete="off">
    <div id="list"></div>
  </aside>
  <main id="main"></main>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const KINDS = {config:"In this config", variant:"Saved variations", vendor:"Vendor defaults"};
// There is one screen now. `editing` (a key position) and `emode` (a creation
// panel) are the two things that can occupy the editor area above the menu, and
// they are mutually exclusive - opening one closes the other. `ptab` is which of
// the six menu tabs below it is showing, and it is independent of both.
const state = {id:null, layer:0, layout:0, base:"", nums:true, hot:null,
               emode:null, drafts:{}, sel:[], assign:{}, msg:null, dts:null,
               editing:null, picker:true, ptab:"keyboard",
               refocus:null, newLayers:{}};
const LIVE = !!DATA.live;
let STORE = DATA.custom || {viledance:[], combo:[], modifier:[], layer:[], macro:[]};

async function api(method, path, body){
  const r = await fetch(path, {method,
    headers: body ? {"Content-Type":"application/json"} : {},
    body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const say = (text, bad) => { state.msg = text ? {text, bad} : null; };
const msgHtml = () => state.msg
  ? `<div class="msg ${state.msg.bad?"bad":"ok"}">${esc(state.msg.text)}</div>` : "";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
// `esc()` is enough for a text node, and for an attribute whose value cannot
// contain a quote - which was every attribute here until a macro's `text` step,
// where the user types arbitrary text and `He said "hi"` would end the attribute
// early. Anything of theirs going into an attribute goes through this instead.
const escA = s => esc(s).replace(/"/g, "&quot;");
const byId = id => DATA.keymaps.find(k => k.id === id);

// A scope key names one keymap *file* - `variant:my_board`, `config:corne` -
// and mirrors custom.scope_key() / custom.slug() in the Python half (another
// hand-kept pair, like MODS). It is what a board-wide record's `scopes` map is
// keyed by: a combo is on or off per keymap, not once for everything.
const slugify = n => String(n).trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
const scopeOf = km => km ? `${km.kind}:${slugify(km.name)}` : "";
const scopeOn = (r, scope) => !!(scope && (r.scopes || {})[scope]);

// ZMK's keycode names are not what is printed on the key: `N1` is the 1 key,
// `SQT` the apostrophe, `FSLH` the slash (see the "Keymaps > List of keycodes"
// page on zmk.dev). The picker already carries the legend for every one of them,
// so KEY_LABELS is derived from it rather than typed out a second time - a
// "shifted|plain" label keeps its plain half, since a tile shows what the key
// sends unshifted. Anything the picker does not name keeps its ZMK spelling.
const KEY_LABELS = {}, KEY_SHIFTED = {};
// The same idea for a binding that is not a `&kp` at all - `&bt BT_SEL 0`,
// `&mkp LCLK`, `&rgb_ug RGB_TOG`. Keyed by the whole binding text, filled from
// SYSTEM below (`_learnSystem()`), read by `label()`.
const BIND_LABELS = {};
const normBind = b => String(b).trim().replace(/\s+/g, " ");
function _learnLabels(rows){
  for (const ent of rows){
    const [lbl, code] = ent;
    if (!code || code.startsWith("&")) continue;
    const parts = Array.isArray(lbl) ? lbl : String(lbl).split("|");
    const plain = parts.length > 1 ? parts[1] : parts[0];
    if (plain && !(code in KEY_LABELS)) KEY_LABELS[code] = plain;
    if (parts.length > 1 && !(code in KEY_SHIFTED)) KEY_SHIFTED[code] = parts[0];
  }
}

// ZMK gives most keys several names and the picker only carries one of them.
// These are the long forms that turn up in a real keymap, mapped back to the
// picker's spelling: https://zmk.dev/docs/keymaps/list-of-keycodes
const KEY_ALIASES = {
  ENTER:"RET", RETURN:"RET", ESCAPE:"ESC", BACKSPACE:"BSPC", DELETE:"DEL",
  INSERT:"INS", PAGE_UP:"PG_UP", PAGE_DOWN:"PG_DN", CAPSLOCK:"CAPS",
  PRINTSCREEN:"PSCRN", UP_ARROW:"UP", DOWN_ARROW:"DOWN", LEFT_ARROW:"LEFT",
  RIGHT_ARROW:"RIGHT", LEFT_SHIFT:"LSHFT", RIGHT_SHIFT:"RSHFT",
  LEFT_CONTROL:"LCTRL", RIGHT_CONTROL:"RCTRL", LEFT_ALT:"LALT", RIGHT_ALT:"RALT",
  LEFT_GUI:"LGUI", RIGHT_GUI:"RGUI", LEFT_WIN:"LGUI", RIGHT_WIN:"RGUI",
  LEFT_COMMAND:"LGUI", RIGHT_COMMAND:"RGUI",
  SINGLE_QUOTE:"SQT", APOSTROPHE:"SQT", SEMICOLON:"SEMI", SLASH:"FSLH",
  BACKSLASH:"BSLH", PERIOD:"DOT", LEFT_BRACKET:"LBKT", RIGHT_BRACKET:"RBKT",
  NUMBER_1:"N1", NUMBER_2:"N2", NUMBER_3:"N3", NUMBER_4:"N4", NUMBER_5:"N5",
  NUMBER_6:"N6", NUMBER_7:"N7", NUMBER_8:"N8", NUMBER_9:"N9", NUMBER_0:"N0",
  SPACEBAR:"SPACE", GRAVE_ACCENT:"GRAVE", EQUALS:"EQUAL",
  // media/consumer codes: keys.h names most of these three ways and the
  // Media & system tab carries the short one (see SYSTEM).
  C_VOLUME_UP:"C_VOL_UP", C_VOLUME_DOWN:"C_VOL_DN", C_PLAY_PAUSE:"C_PP",
  C_PREVIOUS:"C_PREV", C_BRIGHTNESS_INC:"C_BRI_UP", C_BRI_INC:"C_BRI_UP",
  C_BRIGHTNESS_DEC:"C_BRI_DN", C_BRI_DEC:"C_BRI_DN", C_FAST_FORWARD:"C_FF",
  C_REWIND:"C_RW", C_POWER:"C_PWR", C_AL_CALCULATOR:"C_AL_CALC",
  C_AL_FILE_BROWSER:"C_AL_FILES", C_AL_EMAIL:"C_AL_MAIL", C_AC_FIND:"C_AC_SEARCH",
  K_APPLICATION:"K_APP"
};
const _code = c => KEY_ALIASES[c] || c;

// The legend on the *upper* half of a keycap, for a bare `&kp <code>` that has
// one: `&kp N1` -> "!". Nothing for a letter, and nothing for a code that is
// already a modified one (`LS(SQT)` types the shifted glyph itself, so there is
// no second thing to print). What the key does with shift is the host's doing,
// not the keymap's - hence a legend rather than a binding hint.
function shiftLegend(b){
  const kp = /^&?kp\s+([A-Z0-9_]+)$/.exec(String(b).trim());
  return (kp && KEY_SHIFTED[_code(kp[1])]) || "";
}

// `&kp N1` -> "1", `&kp LS(SQT)` -> the double quote it actually types. Only a
// bare `&kp <code>` is renamed - any other behavior keeps its own text,
// shortened.
function label(b){
  // A behavior with its own legend - `&bt BT_SEL 0` is "BT 0", not "bt BT_SEL 0".
  const named = BIND_LABELS[normBind(b)];
  if (named) return named;
  const kp = /^&?kp\s+(\S+)$/.exec(String(b).trim());
  if (kp){
    const shift = /^(?:LS|RS)\((\w+)\)$/.exec(kp[1]);
    if (shift && KEY_SHIFTED[_code(shift[1])]) return KEY_SHIFTED[_code(shift[1])];
    if (KEY_LABELS[_code(kp[1])]) return KEY_LABELS[_code(kp[1])];
  }
  return b.replace(/^&/, "")
          .replace(/^kp /, "")
          .replace(/_ARROW\b/g, "")
          .replace(/\bLEFT_/g, "L").replace(/\bRIGHT_/g, "R")
          .replace(/\bBACKSPACE\b/, "BSPC").replace(/\bCONTROL\b/, "CTRL");
}

const behaviorOf = (km, lbl) => (km.behaviors || []).find(x => x.label === lbl);

// Where a behavior is actually used: the first key bound to it, as
// {layer, pos, binding}. A hold-tap declares `bindings = <&kp>, <&kp>;` and
// nothing else - the keys it sends are the *parameters given at the key*
// (`&ht_bkspcshift LSHFT BSPC`), so the node on its own genuinely says "kp, kp".
// This is what lets the Behaviors table show the real keys instead.
function usageOf(km, lbl){
  const layers = km.layers || [];
  for (let li = 0; li < layers.length; li++){
    const bs = layers[li].bindings || [];
    for (let pos = 0; pos < bs.length; pos++)
      if (String(bs[pos]).trim().split(/\s+/)[0].replace(/^&/, "") === lbl)
        return {layer: li, pos, binding: bs[pos]};
  }
  return null;
}

// Resolve a binding through hold-tap / tap-dance / mod-morph nodes to what it
// actually sends, so a board tile for `&vd_x` or `&ht_x_1 LSHIFT BSPC` shows the
// real keys instead of the generated label - a VileDance's tap and hold-tap
// nodes both live in `km.behaviors` (see parse_keymap()), so this walks either
// ours or a hand-written one the same way. `depth` bounds the recursion against
// a malformed or self-referential keymap.
function resolveBinding(km, text, depth){
  text = (text || "").trim();
  if (!text) return null;
  const parts = text.split(/\s+/);
  const head = parts[0].replace(/^&/, "");
  const params = parts.slice(1);
  const beh = depth > 0 ? behaviorOf(km, head) : null;
  // A macro node lives in `km.macros`, not `km.behaviors`, and its `bindings` are
  // a controls-and-keys sequence rather than something to resolve into a tap and a
  // hold - so the tile carries the macro's name and the title carries the sequence.
  const mac = !beh && depth > 0 ? (km.macros || []).find(x => x.label === head) : null;
  // The `mc_` test is for the pending case: a macro assigned but not yet written
  // has no node in this file to find, and the tile should still read `email`
  // rather than `mc_email` while the change is unsaved.
  if (mac || /^mc_/.test(head))
    return {short: head.replace(/^mc_/, ""),
            full: ((mac && mac.bindings || []).join(" ") || text).slice(0, 200)};
  // `shift` rides along with whatever ends up on the tile's main line: the tap
  // of a hold-tap, the first press of a tap-dance. A mod-morph gets none - its
  // second binding already *is* what a modifier turns it into, and that is the
  // `.hint` corner's job, not the legend's.
  if (!beh) return {short: label(text), full: text, shift: shiftLegend(text)};
  if (beh.kind === "hold-tap" && beh.bindings.length === 2){
    const hold = resolveBinding(km, [beh.bindings[0], params[0]].filter(Boolean).join(" "), depth - 1);
    const tap  = resolveBinding(km, [beh.bindings[1], params[1]].filter(Boolean).join(" "), depth - 1);
    return {short: tap ? tap.short : label(text), hint: hold ? hold.short : null,
            shift: tap ? tap.shift : "",
            full: `tap: ${tap ? tap.full : "?"}\nhold: ${hold ? hold.full : "?"}`};
  }
  if (beh.kind === "tap-dance"){
    const rows = beh.bindings.map(e => resolveBinding(km, e, depth - 1));
    return {short: rows[0] ? rows[0].short : label(text), hint: rows[1] ? rows[1].short : null,
            shift: rows[0] ? rows[0].shift : "",
            full: rows.map((r, i) => `${i + 1}\u00d7: ${r ? r.full : "?"}`).join("\n")};
  }
  if (beh.kind === "mod-morph" && beh.bindings.length === 2){
    const plain = resolveBinding(km, beh.bindings[0], depth - 1);
    const mod   = resolveBinding(km, beh.bindings[1], depth - 1);
    return {short: plain ? plain.short : label(text), hint: mod ? mod.short : null,
            full: `plain: ${plain ? plain.full : "?"}\nmodified: ${mod ? mod.full : "?"}`};
  }
  return {short: label(text), full: text, shift: shiftLegend(text)};
}

function sidebar(){
  const q = ($("#filter").value || "").toLowerCase();
  let html = "";
  for (const kind of ["config","variant","vendor"]){
    const rows = DATA.keymaps.filter(k => k.kind === kind &&
      (k.name.toLowerCase().includes(q) || k.path.toLowerCase().includes(q)));
    if (!rows.length) continue;
    html += `<div class="group">${KINDS[kind]}</div>`;
    for (const k of rows)
      html += `<button data-id="${esc(k.id)}" class="${k.id===state.id?"sel":""}">`
            + `${esc(k.name)}<small>${esc(k.path)}</small></button>`;
  }
  $("#list").innerHTML = html || `<div class="group">no matches</div>`;
  $("#list").querySelectorAll("button").forEach(b => b.onclick = () => {
    state.id = b.dataset.id; state.layer = 0; state.layout = 0; state.hot = null;
    sidebar(); render();
  });
}

function board(km, lay, bindings, baseBindings){
  const s = 0.50, pad = 6;
  const xs = lay.keys.map(k => k[2]), ys = lay.keys.map(k => k[3]);
  const w = Math.max(...lay.keys.map(k => k[2]+k[0])) - Math.min(...xs);
  const h = Math.max(...lay.keys.map(k => k[3]+k[1])) - Math.min(...ys);
  const x0 = Math.min(...xs), y0 = Math.min(...ys);
  let html = `<div class="board" style="width:${w*s+pad}px;height:${h*s+pad}px">`;
  lay.keys.forEach((k, i) => {
    const [kw,kh,kx,ky,rot,rx,ry] = k;
    let b = bindings[i];
    const pend = (state.assign[state.layer] || {})[i];
    if (pend !== undefined) b = pend;
    const old = baseBindings ? baseBindings[i] : undefined;
    const cls = ["k"];
    if (b === undefined) cls.push("empty");
    if (old !== undefined && old !== b) cls.push("diff");
    if (state.hot && state.hot.includes(i)) cls.push("hot");
    if (state.emode === "combo" && state.sel.includes(i)) cls.push("pick");
    const pending = (state.assign[state.layer] || {})[i];
    if (pending !== undefined) cls.push("asg");
    if (LIVE) cls.push("clickable");
    if (state.emode !== "combo" && state.editing === i) cls.push("hot");
    let st = `left:${(kx-x0)*s}px;top:${(ky-y0)*s}px;`
           + `width:${kw*s-2}px;height:${kh*s-2}px;`;
    if (rot) st += `transform:rotate(${rot/100}deg);`
                 + `transform-origin:${(rx-kx)*s}px ${(ry-ky)*s}px;`;
    const res = b !== undefined ? resolveBinding(km, b, 3) : null;
    if (res && res.hint) cls.push("compound");
    const oldRes = old !== undefined ? resolveBinding(km, old, 3) : null;
    const tip = res
      ? (res.full !== b ? `${res.full}\n\n${b}  @ ${i}` : `${b}  @ ${i}`)
      : `@ ${i}`;
    html += `<div class="${cls.join(" ")}" style="${st}" data-pos="${i}"`
          + ` title="${esc(tip)}">`
          + (state.nums ? `<span class="pos">${i}</span>` : "")
          + (res && res.hint ? `<span class="hint">${esc(res.hint)}</span>` : "")
          + (res && res.shift && res.shift !== res.short
              ? `<span class="shift">${esc(res.shift)}</span>` : "")
          + `<span class="lbl">${esc(res ? res.short : "")}</span>`
          + (cls.includes("diff") ? `<span class="was">was ${esc(oldRes ? oldRes.short : "")}</span>` : "")
          + `</div>`;
  });
  return html + "</div>";
}

// One view, one render. The header carries no nav any more: the board, the
// editor area and the menu are all on this page at once.
function render(){
  $("#mode").textContent = LIVE ? "live \u00b7 saving to custom/" : "read-only";
  renderKeymap();
}

function renderKeymap(){
  const km = byId(state.id);
  if (!km){ $("#main").innerHTML = "<p>Pick a keyboard on the left.</p>"; return; }
  const lay = km.layouts[Math.min(state.layout, km.layouts.length-1)];
  const allLayers = layersOf(km);
  // Clamp `state.layer` itself, not just the lookup: `board()` and every key
  // click key `state.assign` by it, so a stale index (a pending layer that a
  // save has just written and cleared) would file edits against a layer the
  // base keymap does not have.
  state.layer = Math.min(state.layer, Math.max(allLayers.length-1, 0));
  const layer = allLayers[state.layer];
  // `.pick` on the board mirrors the combo draft's positions - do it before
  // board() is built, not after.
  state.sel = state.emode === "combo"
      ? (draftOf("combo").key_positions || []).map(Number) : [];
  const base = state.base ? byId(state.base) : null;
  const baseLayer = base && base.layers[state.layer];
  const baseBindings = baseLayer && baseLayer.bindings.length === (layer?layer.bindings.length:0)
      ? baseLayer.bindings : null;

  let h = `<div class="bar"><h2>${esc(km.name)}</h2>`
        + `<span class="path">${esc(km.path)}</span></div><div class="bar">`;
  if (km.layouts.length > 1){
    h += `<select id="layout">` + km.layouts.map((l,i) =>
      `<option value="${i}" ${i===state.layout?"selected":""}>`
      + `${esc(l.display || l.label)} &middot; ${l.count} keys</option>`).join("") + `</select>`;
  } else {
    h += `<span class="path">${esc(lay.display || lay.label)} &middot; ${lay.count} keys</span>`;
  }
  h += `<select id="base"><option value="">compare with&hellip; (off)</option>`
     + DATA.keymaps.filter(k => k.id !== km.id).map(k =>
        `<option value="${esc(k.id)}" ${k.id===state.base?"selected":""}>`
        + `${esc(k.kind)}: ${esc(k.path)}</option>`).join("") + `</select>`;
  h += `<label class="toggle"><input type="checkbox" id="nums" ${state.nums?"checked":""}>`
     + ` key positions</label></div>`;
  if (LIVE){
    const n = Object.values(state.assign).reduce((a,o) => a + Object.keys(o).length, 0);
    const nl = (state.newLayers[km.id] || []).length;
    const dirty = n || nl;
    // Only `variants/` is ours to write. A config or vendor keymap can be saved
    // *from*, never over - so "Save here" exists for a variant and nothing else.
    const own = km.kind === "variant";
    h += `<div class="bar">`
       + `<span class="path">click a key to assign a VileDance or any binding</span>`
       + (dirty ? `<span class="path">${n} pending change(s)`
            + (nl ? `, ${nl} new layer(s)` : "") + `</span>` : "")
       + (own ? `<button class="act" id="savehere">Save to ${esc(km.name)}</button>` : "")
       + `<span class="path">save as</span>`
       + `<input class="kb wide" id="vname" placeholder="letters, digits, underscores"`
       + ` value="${esc(slugify(km.name) + (own ? "_2" : "_custom"))}">`
       + `<button class="${own ? "ghost" : "act"}" id="savevar">Save as new variant</button>`
       + (dirty ? `<button class="ghost" id="clearvar">Discard</button>` : "")
       + (own ? `<button class="ghost danger" id="delvar">Delete variant</button>` : "")
       + `</div>` + msgHtml();
  }

  for (const w of km.warnings) h += `<div class="warn">${esc(w)}</div>`;
  if (state.base && !baseBindings)
    h += `<div class="warn">comparison off for this layer: the two keymaps`
       + ` disagree on layer count or key count</div>`;

  h += `<div class="tabs">` + allLayers.map((l,i) =>
      `<button data-layer="${i}" class="${i===state.layer?"sel":""}"`
      + `${l.pending ? ` title="not saved yet - Save as variant to write it"` : ""}>`
      + `${i}&nbsp;&middot;&nbsp;${esc(l.display)}${l.pending ? " *" : ""}</button>`).join("")
    + (LIVE && allLayers.length < 32
        ? `<button class="ghost sm" id="addlayer">+ layer</button>` : "")
    + `</div>`;

  if (!layer || layer.reserved){
    h += `<p class="legend">This layer is <code>status = "reserved"</code>: empty here,`
       + ` available to fill in from ZMK Studio.</p>`;
  } else {
    if (lay.approximate)
      h += `<div class="legend">No <code>zmk,physical-layout</code> for this keyboard;`
         + ` keys are drawn on a plain grid, but the numbers are still the real`
         + ` key positions.</div>`;
    h += board(km, lay, layer.bindings, baseBindings);
  }
  // The editor area holds one of three things: a key's editor, a creation panel,
  // or nothing. The menu below it is always there in LIVE mode - the board-wide
  // tabs have nothing to do with whichever of the three is open.
  if (LIVE) h += editorHtml(km, layer) + menuHtml(km, layer);

  h += `<div class="cols">`;
  if (km.combos.length){
    h += `<section class="card"><h3>Combos</h3><table><tr><th>name</th><th>keys</th>`
       + `<th>sends</th><th>ms</th><th>layers</th></tr>`
       + km.combos.map((c,i) => `<tr class="combo" data-combo="${i}">`
          + `<td>${esc(c.name)}</td><td class="mono">${c.positions.join(" ")}</td>`
          + `<td class="mono">${esc(c.bindings)}</td><td>${c.timeout ?? ""}</td>`
          + `<td>${c.layers.length ? c.layers.join(" ") : "all"}</td></tr>`).join("")
       + `</table></section>`;
  }
  if (km.behaviors.length){
    h += `<section class="card"><h3>Behaviors</h3><table><tr><th>&amp;label</th>`
       + `<th>type</th><th>sends</th></tr>`
       + km.behaviors.map(b => {
          const use = usageOf(km, b.label);
          const res = use ? resolveBinding(km, use.binding, 3) : null;
          // With a key to read the parameters off, show what it sends; without
          // one, the node's own `bindings` is all there is to show, and it is
          // worth saying why that reads as `&kp, &kp`.
          const sends = res
            ? esc(res.full).replace(/\n/g, "<br>")
            : esc(b.bindings.join(", "));
          // A hold-tap or a mod-morph declares `bindings = <&kp>, <&kp>;` and
          // takes its keys from the key - so when no key uses it there is
          // genuinely nothing more to show, and that is worth saying. Every
          // other kind carries its own complete bindings.
          const note = use
            ? `${esc(use.binding)} &middot; key ${use.pos}, layer ${use.layer}`
            : b.kind === "hold-tap" || b.kind === "mod-morph"
              ? `on no key here &ndash; its keys come from the key it is put on`
              : b.kind === "sensor-rotate" ? `on an encoder, not a key`
              : `on no key here`;
          return `<tr${use ? ` class="usedby" data-behpos="${use.pos}"`
                             + ` data-behlayer="${use.layer}"` : ""}>`
            + `<td class="mono">&amp;${esc(b.label)}</td>`
            + `<td>${esc(b.kind)}</td><td class="mono">${sends}`
            + `<br><span style="color:var(--muted)">${note}</span>`
            + (Object.keys(b.props).length ? `<br><span style="color:var(--muted)">`
               + esc(Object.entries(b.props).map(([k,v]) => k+"="+v).join("  ")) + `</span>` : "")
            + `</td></tr>`;
         }).join("") + `</table></section>`;
  }
  if (km.macros.length){
    h += `<section class="card"><h3>Macros</h3><table><tr><th>&amp;label</th>`
       + `<th>type</th><th>bindings</th></tr>`
       + km.macros.map(b => `<tr><td class="mono">&amp;${esc(b.label)}</td>`
          + `<td>${esc(b.kind)}</td><td class="mono">${esc(b.bindings.join(" "))}</td></tr>`
         ).join("") + `</table></section>`;
  }
  h += `</div>`;
  $("#main").innerHTML = h;

  $("#main").querySelectorAll("[data-layer]").forEach(b => b.onclick = () => {
    state.layer = +b.dataset.layer; render();
  });
  const ls = $("#layout"); if (ls) ls.onchange = e => { state.layout = +e.target.value; render(); };
  $("#base").onchange = e => { state.base = e.target.value; render(); };
  $("#nums").onchange = e => { state.nums = e.target.checked; render(); };
  $("#main").querySelectorAll("[data-combo]").forEach(tr => {
    tr.onmouseenter = () => { state.hot = km.combos[+tr.dataset.combo].positions; render(); };
    tr.onmouseleave = () => { state.hot = null; render(); };
  });
  // Same highlight for a behavior row: hovering it points at the key whose
  // parameters the "sends" column was read from - but only while that key's own
  // layer is the one on screen.
  $("#main").querySelectorAll("[data-behpos]").forEach(tr => {
    tr.onmouseenter = () => {
      if (+tr.dataset.behlayer !== state.layer) return;
      state.hot = [+tr.dataset.behpos]; render();
    };
    tr.onmouseleave = () => { state.hot = null; render(); };
  });
  if (LIVE){
    $("#main").querySelectorAll(".board [data-pos]").forEach(el => {
      el.onclick = () => {
        const pos = +el.dataset.pos;
        // While a combo is being drafted the board *is* the chord picker; every
        // other time, clicking a key opens that key's editor.
        if (state.emode === "combo"){
          const d = draftOf("combo");
          const list = new Set((d.key_positions || []).map(Number));
          list.has(pos) ? list.delete(pos) : list.add(pos);
          d.key_positions = [...list].sort((a,b) => a-b);
        } else {
          state.emode = null; state.editing = pos; state.dts = null; say(null);
        }
        render();
      };
    });
    wireEditor(km, layer);
    const sv = $("#savevar"); if (sv) sv.onclick = () => saveVariant(km);
    const sh = $("#savehere"); if (sh) sh.onclick = () => saveVariant(km, km.name);
    const dv = $("#delvar"); if (dv) dv.onclick = () => deleteVariant(km);
    const cv = $("#clearvar");
    if (cv) cv.onclick = () => {
      state.assign = {}; state.newLayers[km.id] = []; say(null); render();
    };
    const al = $("#addlayer");
    if (al) al.onclick = () => {
      const n = allLayers.length;
      const name = (prompt("Layer name", `layer_${n}`) || "").trim();
      if (!name) return;
      (state.newLayers[km.id] = state.newLayers[km.id] || []).push({name});
      state.layer = n;
      render();
    };
    // a mod-chain click re-renders the whole page, so put the caret back
    if (state.refocus){
      const el = $(`[data-f="${state.refocus}"]`);
      state.refocus = null;
      if (el) el.focus();
    }
  }
}

   ["Print Screen","PSCRN",1], ["Scroll Lock","SLCK",1], ["Pause","PAUSE_BREAK",1]],

  [["~|`","GRAVE",1], ["!|1","N1",1], ["@|2","N2",1], ["#|3","N3",1],
   ["$|4","N4",1], ["%|5","N5",1], ["^|6","N6",1], ["&|7","N7",1],
