# The Python equivalent of package.json. `dependencies` is empty on purpose:
# every tool here runs on the standard library alone, so there is nothing to
# install before using them. Installing this project only puts the three
# commands on your PATH.

[project]
name = "vilemk"
version = "0.1.0"
description = "Read, check and view ZMK keymaps from a zmk-cli config repo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
vilemk-keypos = "vilemk.keypos:main"
vilemk-check = "vilemk.check:main"
vilemk-design = "vilemk.webui.server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# One package, `vilemk`, with `webui` under it.
packages = ["vilemk", "vilemk.webui"]

[tool.setuptools.package-data]
# `dist/` is the built React app and two PNGs it references. It is generated by
# `make web` and not in the tree, so a wheel built without that step carries no
# page at all and the server's static route says so at runtime.
"vilemk.webui" = ["dist/**", "assets/*.png"]

[tool.ruff]
target-version = "py39"
line-length = 100
