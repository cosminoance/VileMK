# The Python equivalent of package.json. `dependencies` is empty on purpose:
# every tool here runs on the standard library alone, so there is nothing to
# install before using them. Installing this project only puts the four
# commands on your PATH.

[project]
name = "vilemk"
version = "0.1.0"
description = "Read, check and view ZMK keymaps from a zmk-cli config repo"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
vilemk-ui = "vilemk.webui.build:main"
vilemk-keypos = "vilemk.keypos:main"
vilemk-check = "vilemk.check:main"
vilemk-design = "vilemk.webui.server:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# One package, `vilemk`, with `webui` under it.
packages = ["vilemk", "vilemk.webui"]

[tool.setuptools.package-data]
# The page is real .html/.css/.js files and two PNGs, not Python strings - they
# all have to ship. `template.html` is only the shell; `build.template()` expands
# its `<!--#include ...-->` directives from `page/`.
#
# setuptools' `include-package-data` defaults to true for pyproject.toml
# projects, so these globs are belt-and-braces rather than load-bearing: a wheel
# built from a clean tree carries `page/` and `assets/` either way (measured,
# both inside and outside a git checkout). They are listed anyway because the
# failure mode is quiet - a missing `page/` file emits a page with an empty
# <style> and an empty <script> rather than raising, and `build_html()` calls
# `_data_uri()` unconditionally for the favicon and the logo.
"vilemk.webui" = ["template.html", "page/*.css", "page/*.js", "assets/*.png"]

[tool.ruff]
target-version = "py39"
line-length = 100
