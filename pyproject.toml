# The Python equivalent of package.json. Every tool runs on the standard library
# except `vilemk.studio`, which needs pyserial to reach a keyboard over USB.
# `vilemk/deps.py` installs it into .venv/ on first start when it is missing.
# Installing this project puts the commands below on your PATH.

[project]
name = "vilemk"
version = "0.4.2"
description = "Design, check and build ZMK keymaps"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
vilemk-keypos = "vilemk.keypos:main"
vilemk-check = "vilemk.check:main"
vilemk-design = "vilemk.webui.server:main"
vilemk-workspace = "vilemk.workspace:main"
vilemk-build = "vilemk.firmware:main"
vilemk-studio = "vilemk.studio:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# One package, `vilemk`, with `webui` under it.
packages = ["vilemk", "vilemk.webui"]

[tool.setuptools.package-data]
# `dist/` is the built React app and two PNGs it references. It is generated by
# `make web` and not in the tree, so a wheel built without that step carries no
# page at all and the server's static route says so at runtime.
"vilemk.webui" = ["dist/**", "assets/*.png"]

[tool.ruff]
target-version = "py39"
line-length = 100
